[defaults]
# 指定清单文件
inventory = inventory.ini
# 禁用主机密钥检查（首次连接时自动接受）
host_key_checking = False
# 设置远程用户（根据你的远程主机修改，在inventory中覆盖）
# remote_user = ubuntu
# 设置SSH私钥路径（根据你的密钥修改）
private_key_file = ~/.ssh/ansible_id_rsa
# 设置角色路径
roles_path = ./roles

[privilege_escalation]
# 默认不使用sudo权限（如需sudo，在playbook中明确指定）
become = False
# 使用sudo方式
become_method = sudo
# 提升到root用户
become_user = root
# 不询问sudo密码（如果 inventory 中设置了 ansible_become_password）
become_ask_pass = False
